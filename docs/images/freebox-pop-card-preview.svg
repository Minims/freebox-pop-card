<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1540" viewBox="0 0 1200 1540" role="img" aria-labelledby="title desc">
  <title id="title">Freebox Pop Card preview</title>
  <desc id="desc">A dark Home Assistant dashboard card showing Freebox connection, system, equipment, clients, and controls.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4b2828"/>
      <stop offset=".55" stop-color="#2c2c2c"/>
      <stop offset="1" stop-color="#242424"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop stop-color="#00a9dc"/>
      <stop offset="1" stop-color="#2eae65"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <style>
      .t{font-family:Arial,sans-serif;fill:#e7e7e7}.muted{fill:#a8a8a8}.title{font-size:28px;font-weight:700}.section{font-size:24px;font-weight:700}.label{font-size:22px}.value{font-size:23px;font-weight:700}.tiny{font-size:18px}.panel{fill:#282828;stroke:#434343;stroke-width:1.5}.metric{fill:#202020;stroke:#333;stroke-width:1}.cyan{fill:#02afe0}.green{fill:#31b96e}.red{fill:#f05b54}.line{stroke:#414141;stroke-width:1}.pill{fill:#303030;stroke:#4b4b4b;stroke-width:1}.button{fill:#252525;stroke:#4b4b4b;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="1540" fill="#101010"/>
  <g filter="url(#shadow)">
    <rect x="140" y="44" width="920" height="1450" rx="24" fill="#1b1b1b" stroke="#444" stroke-width="1.5"/>
    <rect x="140" y="44" width="920" height="4" rx="2" fill="#e10600"/>

    <text class="t title" x="174" y="94">Freebox v8 (r1)</text>
    <circle cx="181" cy="129" r="7" class="green"/>
    <text class="t muted label" x="197" y="137">En ligne · ftth</text>
    <rect class="button" x="928" y="70" width="48" height="48" rx="15"/>
    <text class="t" x="942" y="103" font-size="28">◎</text>
    <rect class="button" x="986" y="70" width="48" height="48" rx="15"/>
    <text class="t" x="998" y="104" font-size="27">↻</text>

    <rect x="174" y="164" width="852" height="280" rx="26" fill="url(#hero)" stroke="#464646" stroke-width="1.5"/>
    <circle cx="293" cy="302" r="76" fill="#eee" stroke="#c8c8c8" stroke-width="2"/>
    <circle cx="293" cy="302" r="59" fill="none" stroke="#d1d1d1"/>
    <circle cx="344" cy="350" r="5" class="green"/>
    <text x="267" y="316" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#222">free</text>
    <text class="t section" x="412" y="217">Freebox v8 (r1)</text>
    <text class="t muted label" x="412" y="253">192.0.2.42 · Uptime système 2 h 33 min</text>
    <rect class="metric" x="412" y="281" width="280" height="118" rx="16"/>
    <text class="cyan" x="431" y="321" font-size="25">⇩</text><text class="t muted label" x="460" y="321">Descendant</text>
    <text class="t value" x="431" y="366">735 kB/s</text>
    <rect class="metric" x="710" y="281" width="280" height="118" rx="16"/>
    <text class="cyan" x="729" y="321" font-size="25">⇧</text><text class="t muted label" x="758" y="321">Montant</text>
    <text class="t value" x="729" y="366">17 kB/s</text>

    <rect class="panel" x="174" y="462" width="852" height="214" rx="20"/>
    <text class="cyan" x="202" y="510" font-size="27">◉</text><text class="t section" x="236" y="510">Connexion</text>
    <text class="t muted label" x="913" y="510">En ligne</text>
    <text class="t muted label" x="202" y="557">Accès</text><text class="t value" x="941" y="557" text-anchor="end">ftth</text>
    <text class="t muted label" x="202" y="600">Adresse IPv4</text><text class="t value" x="941" y="600" text-anchor="end">192.0.2.42</text>
    <text class="t muted label" x="202" y="643">Uptime connexion</text><text class="t value" x="941" y="643" text-anchor="end">Non exposé</text>

    <rect class="panel" x="174" y="694" width="852" height="292" rx="20"/>
    <text class="cyan" x="202" y="743" font-size="25">▦</text><text class="t section" x="236" y="743">Système</text>
    <text class="t muted label" x="202" y="790">Uptime système</text><text class="t value" x="941" y="790" text-anchor="end">2 h 33 min</text>
    <line class="line" x1="202" y1="814" x2="998" y2="814"/>
    <text class="t muted" x="202" y="852" font-size="19" font-weight="700">TEMPÉRATURES</text>
    <rect class="pill" x="202" y="870" width="796" height="54" rx="13"/>
    <text class="t label" x="222" y="905">Température CPU B</text><text class="t value" x="969" y="905" text-anchor="end">73,0 °C</text>
    <text class="t muted" x="202" y="957" font-size="19" font-weight="700">VENTILATEURS</text>
    <rect class="pill" x="202" y="970" width="796" height="54" rx="13"/>
    <text class="t label" x="222" y="1005">Ventilateur 1</text><text class="t value" x="969" y="1005" text-anchor="end">1 522 rpm</text>

    <rect class="panel" x="174" y="1004" width="852" height="228" rx="20"/>
    <text class="cyan" x="202" y="1052" font-size="25">⌁</text><text class="t section" x="236" y="1052">Équipements Freebox</text>
    <rect class="pill" x="202" y="1074" width="796" height="43" rx="11"/>
    <text class="cyan" x="221" y="1103" font-size="19">▣</text><text class="t label" x="250" y="1103">Freebox Player POP</text><circle cx="925" cy="1095" r="5" class="green"/><text class="t tiny" x="943" y="1102">Actif</text>
    <rect class="pill" x="202" y="1127" width="796" height="43" rx="11"/>
    <text class="cyan" x="221" y="1156" font-size="19">⌁</text><text class="t label" x="250" y="1156">Répéteur Wi-Fi</text><circle cx="925" cy="1148" r="5" fill="#888"/><text class="t tiny muted" x="943" y="1155">Inactif</text>
    <rect class="pill" x="202" y="1180" width="796" height="43" rx="11"/>
    <text class="cyan" x="221" y="1209" font-size="19">☎</text><text class="t label" x="250" y="1209">Téléphone DECT</text><circle cx="925" cy="1201" r="5" class="green"/><text class="t tiny" x="943" y="1208">Actif</text>

    <rect class="panel" x="174" y="1250" width="852" height="216" rx="20"/>
    <text class="cyan" x="202" y="1298" font-size="26">☷</text><text class="t section" x="236" y="1298">Contrôles</text>
    <rect x="202" y="1320" width="250" height="58" rx="14" fill="#224334" stroke="#3e8d63"/>
    <text class="t label" x="224" y="1357">⌁  Wi-Fi</text><rect x="397" y="1337" width="37" height="20" rx="10" class="green"/><circle cx="423" cy="1347" r="7" fill="#fff"/>
    <rect class="button" x="466" y="1320" width="252" height="58" rx="14"/>
    <text class="t label" x="486" y="1357">☎  Appels lus</text>
    <rect x="732" y="1320" width="266" height="58" rx="14" fill="#3a2929" stroke="#8b5050"/>
    <text class="red label" x="752" y="1357">↻  Hard reboot</text>
    <text class="t muted tiny" x="202" y="1424">Les clients supplémentaires se déplient d’un clic.</text>
  </g>
</svg>
