name: Release

on:
  push:
    tags: ["20*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Prepare HACS asset
        run: cp dist/freebox-pop-card.js freebox-pop-card.js
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: freebox-pop-card.js
